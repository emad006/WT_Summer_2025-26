<!DOCTYPE html>
<html>
    <head>
        <title>Contact Form</title>
        <meta name="author" content="Emad">
        <meta name="description" content="Contact Form">
        <link rel="stylesheet" type="text/css" href="style.css">
        <script src="script.js"></script>
    </head>

    <body onload="startClock()">
        <h1>Contact Form</h1>
        <button id="switchBtn" onclick="ToggleMode()">Switch to Dark Mode</button>
        <p id="greeting"></p>
        <p id="clock"></p>

        <form onsubmit="handleSubmit()">
            <fieldset>
                <legend>Contact Information</legend>

                    <table border="1">
                    <tr>
                        <td><label>Name:</label></td>
                        <td><input type="text" id="name" class="input-field"></td>
                    </tr>

                    <tr>
                        <td><label>Age:</label></td>
                        <td><input type="number" id="age" class="input-field"></td>
                    </tr>

                    <tr>
                        <td><label>Email:</label></td>
                        <td><input type="email" id="email" class="input-field"></td>
                    </tr>

                    <tr>
                        <td><label>Phone Number:</label></td>
                        <td><input type="tel" id="phone" class="input-field"></td>
                    </tr>

                    <tr>
                        <td><label>Password:</label></td>
                        <td><input type="password" id="password" class="input-field"></td>
                    </tr>

                    <tr>
                        <td><label>Confirm Password:</label></td>
                        <td><input type="password" id="confirmPassword" class="input-field"></td>
                    </tr>

                    <tr>
                        <td><label>Message:</label></td>
                        <td><textarea id="message" class="input-field"></textarea></td>
                    </tr>

                    <tr>
                        <td colspan="2"><button type="submit">Submit</button></td>
                    </tr>
                    
                </table>
            </fieldset>
        </form>

        <footer>
            <p>&copy; 2026 Emad. All Rights Reserved.</p>
        </footer>
    </body>
</html>
